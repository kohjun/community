# Sliper IP certificate validation only. Install after existing sites; never replace them.
server {
    listen 80;
    server_name __SLIPER_PUBLIC_IP__;
    location ^~ /.well-known/acme-challenge/ {
        proxy_pass http://127.0.0.1:13080;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        proxy_buffering off;
        add_header X-Sliper-ACME 1 always;
    }
    location / { return 404; }
}
