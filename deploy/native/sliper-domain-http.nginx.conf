# Sliper domain only. Existing Nginx virtual hosts remain unchanged.
server {
    listen 80;
    server_name sliper.kr www.sliper.kr;
    server_tokens off;
    access_log off;
    error_log /var/log/sliper-domain/nginx-error.log crit;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/sliper-domain-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        default_type text/plain;
        return 503 "Sliper HTTPS setup in progress.\n";
    }
}
