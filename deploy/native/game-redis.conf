bind 127.0.0.1
port 13005
protected-mode yes
daemonize no
supervised no
logfile ""
save ""
appendonly no
databases 1
maxmemory 128mb
maxmemory-policy noeviction
maxclients 256
client-output-buffer-limit pubsub 16mb 8mb 60
user default on nopass -@all ~sliper:game-ink:* &sliper:game-ink:* +@connection +get +set +del +eval +lrange +rpush +expire +publish +subscribe +unsubscribe
