# Sliper only. Existing virtual hosts are not modified.
server {
    listen 80;
    server_name sliper.kr www.sliper.kr;
    server_tokens off;
    access_log off;
    error_log /var/log/sliper-domain/nginx-error.log crit;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/sliper-domain-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://sliper.kr$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name www.sliper.kr;
    ssl_certificate /var/lib/sliper-domain-certbot/config/live/sliper.kr/fullchain.pem;
    ssl_certificate_key /var/lib/sliper-domain-certbot/config/live/sliper.kr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    access_log off;
    error_log /var/log/sliper-domain/nginx-error.log crit;
    return 308 https://sliper.kr$request_uri;
}
server {
    listen 443 ssl http2;
    server_name sliper.kr;
    ssl_certificate /var/lib/sliper-domain-certbot/config/live/sliper.kr/fullchain.pem;
    ssl_certificate_key /var/lib/sliper-domain-certbot/config/live/sliper.kr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:sliper_domain_tls:10m;
    ssl_session_timeout 1d;
    server_tokens off;
    access_log off;
    error_log /var/log/sliper-domain/nginx-error.log crit;
    # Supabase session cookies can exceed the default request-header limit.
    client_header_buffer_size 4k;
    large_client_header_buffers 4 16k;
    # nginx 1.18 needs matching HTTP/2 limits (newer nginx uses the buffers above).
    http2_max_field_size 16k;
    http2_max_header_size 64k;
    client_max_body_size 64m;
    client_header_timeout 10s;
    client_body_timeout 120s;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=86400" always;
    location = /ops/health {
        proxy_pass http://127.0.0.1:13002/ops/health;
        proxy_set_header Host sliper.kr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        proxy_next_upstream off;
    }
    location / {
        proxy_pass http://127.0.0.1:13001;
        proxy_http_version 1.1;
        proxy_set_header Host sliper.kr;
        proxy_set_header X-Forwarded-Host sliper.kr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        # OAuth callbacks return several Set-Cookie headers even without body buffering.
        proxy_buffer_size 64k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 128k;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        proxy_next_upstream off;
    }
}
