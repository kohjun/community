# Include within the existing sliper.kr HTTPS server, before location /.
# No external port or extra domain is required. Internal signed APIs stay off the public proxy.
location ^~ /town-ws/internal/ { return 404; }
location ^~ /town-ws/matchmake/joinById/ {
    proxy_pass http://127.0.0.1:13003/matchmake/joinById/;
    client_max_body_size 4k;
    proxy_http_version 1.1;
    proxy_set_header Host sliper.kr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Cookie "";
    proxy_buffering off;
    proxy_read_timeout 15s;
}
location ~ ^/town-ws/([A-Za-z0-9_-]+)/([A-Za-z0-9_-]+)$ {
    proxy_pass http://127.0.0.1:13003/$1/$2$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host sliper.kr;
    proxy_set_header Cookie "";
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_buffering off;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
}
location /town-ws { return 404; }
